name: huddle-mirror

# gethuddle.social is behind Vercel's bot challenge — every plain HTTP client
# gets 429 regardless of headers or IP — so the corpus is pulled by a real
# headless browser here and published to the `data` branch as static JSON that
# the huddle_events tool can fetch normally.
#
# The branch is force-pushed as a single orphan commit each run, so twice-hourly
# refreshes of a ~1.7 MB file never grow the repo's history.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: huddle-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx puppeteer browsers install chrome

      - name: Pull the Huddle corpus
        run: node scripts/huddle-mirror.mjs --out "$RUNNER_TEMP/huddle-purdue.json"

      - name: Publish to the data branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p publish && cd publish
          cp ../huddle-purdue.json .
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huddle-purdue.json
          git commit -q -m "Huddle mirror $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
